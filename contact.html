<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Fitness 4 All</title>
    <style>
        :root {
            --bg-dark: #0A111E;
            --card-bg: #132238;
            --accent-green: #00FF66;
            --accent-blue: #00A3FF;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #1E3A5F;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0; padding: 0;
            line-height: 1.6;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        header { border-bottom: 1px solid var(--border); padding: 15px 0; background-color: rgba(10, 17, 30, 0.9); }
        .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--accent-green); text-decoration: none; }
        .logo span { color: var(--accent-blue); }

        .hamburger-btn { background: none; border: none; color: var(--text-main); font-size: 1.8rem; cursor: pointer; padding: 0; }
        .side-drawer { position: fixed; top: 0; right: -300px; width: 260px; height: 100%; background-color: var(--card-bg); border-left: 1px solid var(--border); box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5); z-index: 1000; display: flex; flex-direction: column; padding: 25px 20px; transition: right 0.3s ease-in-out; box-sizing: border-box; }
        .side-drawer.open { right: 0; }
        .drawer-header { display: flex; justify-content: flex-end; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 2rem; cursor: pointer; padding: 0; }
        .close-btn:hover { color: var(--accent-green); }
        .drawer-nav { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
        .drawer-nav a { color: var(--text-main); text-decoration: none; font-size: 1.2rem; font-weight: 700; transition: color 0.2s; }
        .drawer-nav a:hover, .drawer-nav a.active { color: var(--accent-green); }
        .drawer-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); }
        .lang-select { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 6px 10px; border-radius: 4px; cursor: pointer; width: 100%; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); display: none; z-index: 999; }
        .drawer-overlay.active { display: block; }

        .box { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 12px; margin-top: 30px; }
        input, textarea, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-dark); color: #fff; box-sizing: border-box; }
        button { background: var(--accent-green); color: #000; font-weight: 800; cursor: pointer; border: none; }

        footer { border-top: 1px solid var(--border); padding: 30px 0; margin-top: 60px; background-color: var(--card-bg); text-align: center; font-size: 0.9rem; color: var(--text-muted); }
        .footer-links { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-main); text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <a href="./index.html" class="logo">FITNESS <span>4 ALL</span></a>
            <button class="hamburger-btn" onclick="toggleMenu()" aria-label="Open Menu">☰</button>
        </div>
    </header>

    <div class="side-drawer" id="sideDrawer">
        <div class="drawer-header">
            <button class="close-btn" onclick="toggleMenu()">&times;</button>
        </div>
        <nav class="drawer-nav">
            <a href="./index.html" data-key="nav-home">Home</a>
            <a href="./articles.html" data-key="nav-articles">Articles & News</a>
            <a href="./recipes.html" data-key="nav-recipes">Healthy Recipes</a>
            <a href="./calculators.html" data-key="nav-calc">Calculators</a>
            <a href="./contact.html" class="active" data-key="nav-contact">Contact</a>
        </nav>
        <div class="drawer-footer">
            <select class="lang-select" onchange="switchLanguage(this.value)">
                <option value="en">EN</option>
                <option value="pt">PT</option>
            </select>
        </div>
    </div>
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu()"></div>

    <main class="container">
        <h1 style="margin-top: 40px;" data-key="title">Connect With Us</h1>
        <div class="box">
            <h3 data-key="form-title">Send a Message</h3>
            <form onsubmit="event.preventDefault(); alert('Message Sent!');">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="5" placeholder="Your question or partnership inquiry..." required></textarea>
                <button type="submit" data-key="btn-send">Send Message</button>
            </form>

            <h3 style="margin-top: 30px;" data-key="social-title">Follow Our Channels</h3>
            <p style="color: var(--text-muted);">• <strong>YouTube:</strong> @Fitness4AllOfficial<br>• <strong>Instagram:</strong> @Fitness4All_Hub</p>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a href="./privacy.html" data-key="foot-privacy">Privacy Policy</a>
            <a href="./contact.html" data-key="foot-contact">Contact</a>
        </div>
        <div style="margin-top: 12px; font-size: 0.8rem;" data-key="foot-copy">© 2026 Fitness 4 All. All rights reserved.</div>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('sideDrawer').classList.toggle('open');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        const translations = {
            en: {
                "nav-home": "Home",
                "nav-articles": "Articles & News",
                "nav-recipes": "Healthy Recipes",
                "nav-calc": "Calculators",
                "nav-contact": "Contact",
                "title": "Connect With Us",
                "form-title": "Send a Message",
                "btn-send": "Send Message",
                "social-title": "Follow Our Channels",
                "foot-privacy": "Privacy Policy",
                "foot-contact": "Contact",
                "foot-copy": "© 2026 Fitness 4 All. All rights reserved."
            },
            pt: {
                "nav-home": "Início",
                "nav-articles": "Artigos & Notícias",
                "nav-recipes": "Receitas Saudáveis",
                "nav-calc": "Calculadoras",
                "nav-contact": "Contacto",
                "title": "Fale Connosco",
                "form-title": "Enviar Mensagem",
                "btn-send": "Enviar Mensagem",
                "social-title": "Siga os Nossos Canais",
                "foot-privacy": "Política de Privacidade",
                "foot-contact": "Contacto",
                "foot-copy": "© 2026 Fitness 4 All. Todos os direitos reservados."
            }
        };

        function switchLanguage(lang) {
            document.querySelectorAll('[data-key]').forEach(elem => {
                const key = elem.getAttribute('data-key');
                if (translations[lang] && translations[lang][key]) {
                    elem.textContent = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
