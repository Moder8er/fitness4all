<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article - Fitness 4 All</title>
  <link rel="stylesheet" href="style.css">
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Marked.js Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- js-yaml Front Matter Parser -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml/dist/js-yaml.min.js"></script>
</head>
<body class="dark-theme">
  <!-- Dynamic Article Container -->
  <main class="container article-layout" style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <a href="articles.html" style="color: var(--accent-green); text-decoration: none; font-weight: bold;">← Back to Articles</a>
    
    <div id="article-header" style="margin-top: 20px;">
      <span id="article-category" style="background: var(--accent-green); color: #000; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 0.85rem;">...</span>
      <h1 id="article-title" style="margin-top: 15px; color: #fff;">Loading Article...</h1>
      <p id="article-date" style="color: #aaa; font-size: 0.9rem;">...</p>
    </div>

    <img id="article-banner" src="" alt="" style="width: 100%; border-radius: 8px; margin: 20px 0; display: none;">

    <div id="article-body" class="markdown-content" style="color: #ddd; line-height: 1.8; font-size: 1.1rem;"></div>
  </main>

  <script>
    async function loadArticle() {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('file');

      if (!slug) {
        document.getElementById('article-title').innerText = "Article Not Found";
        return;
      }

      try {
        const response = await fetch(`./articles/${slug}.md`);
        if (!response.ok) throw new Error("File not found");
        const rawMarkdown = await response.text();

        // Extract Front Matter (YAML header) and Markdown body
        const parts = rawMarkdown.split('---');
        if (parts.length >= 3) {
          const frontMatter = jsyaml.load(parts[1]);
          const markdownBody = parts.slice(2).join('---');

          // Render metadata
          document.getElementById('article-title').innerText = frontMatter.title || 'Untitled';
          document.title = `${frontMatter.title} - Fitness 4 All`;
          document.getElementById('article-category').innerText = frontMatter.category || 'Fitness';
          
          if (frontMatter.date) {
            const dateObj = new Date(frontMatter.date);
            document.getElementById('article-date').innerText = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          }

          if (frontMatter.thumbnail) {
            const img = document.getElementById('article-banner');
            img.src = frontMatter.thumbnail;
            img.style.display = 'block';
          }

          // Render Markdown content
          document.getElementById('article-body').innerHTML = marked.parse(markdownBody);
        } else {
          document.getElementById('article-body').innerHTML = marked.parse(rawMarkdown);
        }
      } catch (err) {
        document.getElementById('article-title').innerText = "Error Loading Article";
        document.getElementById('article-body').innerHTML = "<p>Could not load the requested article.</p>";
      }
    }

    loadArticle();
  </script>
</body>
</html>
